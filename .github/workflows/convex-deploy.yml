# Deploy Convex production backend when `main` changes.
# Requires repository secret `CONVEX_DEPLOY_KEY` (Convex Dashboard → Production → Deploy key).
#
# If Vercel also runs `npx convex deploy` in the build command, each push may deploy twice;
# you can keep both (harmless) or drop deploy from one side.

name: Deploy Convex (production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: convex-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes
